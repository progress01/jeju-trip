<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>濟州島家族旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: basalt-and-tangerine trip board. Overview board (days as columns) for moving things around; day view for reading. */
:root{
  --paper:#f2f4f3; --card:#ffffff; --ink:#1c2321; --muted:#5b6663; --line:#d5dcd9;
  --tang:#d9661f; --tang-soft:#fce6d4; --sea:#1d716f; --sea-soft:#d7ecea;
  --flag:#9a3d22; --flag-soft:#f8e3da; --add:#2f7a3d; --add-soft:#dff0e1; --move:#2b5fa8; --move-soft:#dde8f7;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#131816; --card:#1b2220; --ink:#e6ebe9; --muted:#9ba7a3; --line:#2d3633;
  --tang:#f08a45; --tang-soft:#3a2416; --sea:#56b6b0; --sea-soft:#15302e;
  --flag:#ef9a7c; --flag-soft:#3a2018; --add:#7cc98a; --add-soft:#173020; --move:#8fb4ee; --move-soft:#18253a; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
a{color:var(--sea)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tang);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
header h1{font-size:clamp(28px,6vw,42px);line-height:1.1}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14px;margin-top:6px}
.count b{font-family:var(--f-display);font-size:38px;color:var(--tang);line-height:1}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%}
.tabs button{all:unset;cursor:pointer;padding:6px 14px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--tang)}
.btn{cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.tang{background:var(--tang);border-color:var(--tang);color:#fff}
.btn.danger{background:transparent;color:var(--flag);border-color:var(--flag)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.editsw{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer;user-select:none}
.editsw input{width:18px;height:18px;accent-color:var(--tang)}

.banner{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--sea-soft)}
.banner.draft{background:var(--tang-soft)}
.banner.alt{background:var(--move-soft)}
.banner .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner .msg{flex:1 1 260px;font-size:14px}
.changes{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.changes li.add::marker{color:var(--add)} .changes li.del::marker{color:var(--flag)} .changes li.move::marker{color:var(--move)}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 272px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.colhead{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:0;padding:2px 4px 8px;border-bottom:2px solid var(--ink)}
.colhead .d{font-family:var(--f-mono);font-size:12px;color:var(--tang)}
.colhead .t{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.3}
.colhead .s{font-size:12px;color:var(--muted)}
.lanelabel{font-size:12px;font-weight:700;color:var(--sea);padding:4px 4px 0;display:flex;justify-content:space-between;gap:6px}
.list{display:flex;flex-direction:column;gap:6px;min-height:36px;border-radius:8px;padding:2px}
.edit .list{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 35%,transparent) 8px 9px);outline:1px dashed var(--line)}
.card{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:14px;line-height:1.4}
.card:hover{border-color:var(--sea)}
.card .tm{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card b{font-weight:700}
.card .body{min-width:0;flex:1}
.card.gap{border-style:dashed;border-color:var(--flag)} .card.gap b{color:var(--flag)}
.grip{display:none;flex:0 0 14px;align-self:stretch;cursor:grab;touch-action:none;background:radial-gradient(circle,var(--muted) 1.3px,transparent 1.6px) 0 0/7px 7px;opacity:.6;min-height:22px}
.edit .grip{display:block}
.chgtag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.card.c-add{box-shadow:inset 3px 0 0 var(--add)} .c-add .chgtag{background:var(--add-soft);color:var(--add)}
.card.c-move{box-shadow:inset 3px 0 0 var(--move)} .c-move .chgtag{background:var(--move-soft);color:var(--move)}
.card.c-edit{box-shadow:inset 3px 0 0 var(--tang)} .c-edit .chgtag{background:var(--tang-soft);color:var(--tang)}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 6px 18px rgba(0,0,0,.18)}
.pocket{border-top:1px dashed var(--line);padding-top:6px}
.pocket .lanelabel{color:var(--muted)}
.pocket .card{background:var(--paper)}
.addbtn{all:unset;cursor:pointer;font-size:13px;color:var(--muted);padding:4px 8px;border-radius:6px;text-align:center;border:1px dashed var(--line)}
.addbtn:hover{color:var(--tang);border-color:var(--tang)}
.tix{display:inline-block;margin-top:3px;font-size:11.5px;font-family:var(--f-mono);background:var(--sea-soft);padding:0 7px;border-radius:5px}
.notecount{font-size:12px;color:var(--flag)}
.pill{display:inline-block;font-size:11px;padding:0 8px;border-radius:99px;background:var(--tang-soft);color:var(--tang);font-weight:700;width:max-content;font-family:var(--f-body)}
.pill.ok{background:var(--add-soft);color:var(--add)}
.by{display:inline-block;font-size:11px;color:var(--sea);border:1px solid var(--sea);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px;font-weight:500}
.arch{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.arch ol{margin:0;padding-left:20px;font-size:13px;color:var(--muted)}
.baracts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* drive legs between cards */
.leg{font-size:12px;color:var(--muted);padding:0 0 0 22px;display:flex;align-items:center;gap:6px;min-height:18px}
.leg::before{content:"";width:2px;height:16px;background:var(--line);margin-right:4px}
.leg.warn{color:var(--flag);font-weight:700}
.leg.warn::before{background:var(--flag)}
.approx{font-size:11px;color:var(--flag)}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:820px){.mapwrap{grid-template-columns:1fr}}
#map{height:min(68vh,620px);min-height:360px;border-radius:12px;border:1px solid var(--line);background:var(--sea-soft)}
.maplegend{display:flex;flex-direction:column;gap:8px;font-size:14px}
.maplegend .lg{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mk{width:24px;height:24px;border-radius:50%;color:#fff;font:700 12px/24px var(--f-body);text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk.stay{border-radius:6px;background:#1c2321!important}
.mk.pocket{background:#fff!important;color:#5b6663;border:2px dashed #5b6663;font-size:10px}
.leaflet-container{font-family:var(--f-body)}
/* budget */
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:500}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.big{font-family:var(--f-display);font-size:30px;color:var(--tang);line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
/* location picker */
.picker{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.picker .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pmap{height:240px;border-radius:8px;border:1px solid var(--line)}
.results{display:flex;flex-direction:column;gap:4px}
.results button{all:unset;cursor:pointer;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.results button:hover{border-color:var(--tang)}
.imgprev{max-width:100%;border:1px solid var(--line);border-radius:8px}

/* ---------- header / nav (shared) ---------- */
header.top .tt{min-width:0}
.topright{display:flex;align-items:center;gap:14px}
.count{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:baseline;gap:0 4px;max-width:120px}
.count .lbl{width:100%;text-align:right}
.count .unit{font-size:13px}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-right:6px}
.narrow-only{display:none!important}
.editsw span{white-space:nowrap}
.more{display:flex;flex-direction:column;gap:10px;max-width:560px}
.morebtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700}
.morebtn small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.morebtn svg{width:24px;height:24px;flex:0 0 24px;fill:none;stroke:var(--tang);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.swipehint{display:none}
/* edit button: always obvious */
.editwrap{position:relative}
.editsw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;background:var(--tang);color:#fff;border:0;border-radius:99px;
  padding:8px 16px;font-size:15px;font-weight:700;box-shadow:0 2px 8px color-mix(in srgb,var(--tang) 40%,transparent);white-space:nowrap}
.editsw:hover{filter:brightness(1.05)}
.editsw input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.editsw:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.editsw svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.editsw.on{background:var(--ink);color:var(--paper);box-shadow:none}
.editsw.off{opacity:.45;cursor:not-allowed;box-shadow:none}
.edittip{position:absolute;right:0;top:calc(100% + 10px);background:var(--ink);color:var(--paper);font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;white-space:nowrap;z-index:11;animation:tipbob 1.6s ease-in-out infinite}
.edittip::before{content:"";position:absolute;right:22px;top:-6px;border:6px solid transparent;border-top:0;border-bottom-color:var(--ink)}
@keyframes tipbob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.editbar{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 12px 9px 14px;font-size:14px}
.editbar b{color:var(--tang)}
.editbar span{flex:1;min-width:0}
.editbar .btn{background:var(--tang);border-color:var(--tang);color:#fff;padding:6px 14px}

/* ---------- phone layout ---------- */
@media (max-width:720px){
  body{font-size:15.5px;padding-top:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--paper)}
  .wrap{gap:12px}
  .wide-only{display:none!important}
  .narrow-only{display:flex!important}
  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);flex-wrap:nowrap;align-items:center;
    padding-block:10px 8px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
  header.top h1{font-size:21px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .facts{font-size:12px;margin-top:0;gap:0 8px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
  .facts span:nth-child(n+3){display:none}
  .topright{gap:10px}
  .count{flex-direction:row;flex-wrap:nowrap;max-width:none;align-items:baseline;gap:2px;white-space:nowrap}
  .count .lbl{display:none}
  .count b{font-size:22px}
  .editsw{padding:8px 13px;font-size:14px;gap:5px}
  .editbar{font-size:13px}
  /* bottom tab bar */
  nav.bar{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:10;background:var(--card);border-top:1px solid var(--line);border-bottom:0;
    padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:center}
  nav.bar .tabs{background:transparent;padding:0;width:100%;justify-content:space-around;overflow:visible;gap:0}
  nav.bar .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11px;font-weight:500;color:var(--muted);border-radius:10px}
  nav.bar .tabs button svg{width:24px;height:24px;margin:0}
  nav.bar .tabs button[aria-pressed="true"]{background:transparent;color:var(--tang);font-weight:700}
  /* banner */
  .banner{padding:10px 12px;gap:6px}
  .banner .msg{font-size:13px;flex-basis:100%}
  .banner .btn{padding:6px 11px;font-size:13px}
  /* day view */
  .daychips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:8;background:var(--paper);padding:6px 0;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;scrollbar-width:none}
  .daychips::-webkit-scrollbar{display:none}
  .daychips button{padding:6px 12px;font-size:14px}
  .dayhead{padding-bottom:8px}
  .dayhead h2{font-size:22px}
  .stay{align-items:flex-start;text-align:left;font-size:13px}
  .lanes{gap:22px;margin-top:10px}
  .dv .card{padding:11px 12px;font-size:15px}
  .card .tm{font-size:12.5px}
  .edit .grip{flex-basis:22px;background-size:8px 8px;min-height:30px}
  .addbtn{padding:10px;font-size:14px}
  .swipehint{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
  /* board: one day per screen, snap */
  .board{scroll-snap-type:x mandatory;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;scroll-padding-left:max(16px,env(safe-area-inset-left,0px))}
  .col{flex-basis:84vw}
  .board .card{font-size:14.5px;padding:9px 10px}
  /* map */
  #map{height:calc(100dvh - 250px);min-height:300px}
  .mapwrap{gap:10px}
  /* panels & tables */
  .panel{padding:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpis .kpi:first-child{grid-column:1/-1}
  .big{font-size:24px}
  .tbl{font-size:13.5px}
  /* dialogs become bottom sheets */
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92dvh;border-bottom:0}
  .dlg{padding:18px 16px 0}
  .dlg .acts{position:sticky;bottom:0;background:var(--card);margin:6px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  .dlg .acts .btn{padding:10px 16px;font-size:15px}
  input,select,textarea{font-size:16px}
  .chip{padding:5px 12px;font-size:14px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  footer{display:none}
}

/* day view */
.daychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daychips button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:14px;white-space:nowrap}
.daychips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px}
.dayhead h2{font-size:clamp(22px,4.5vw,30px)}
.eyebrow{font-family:var(--f-mono);color:var(--tang);font-size:13px;letter-spacing:.06em}
.stay{font-size:14px;display:flex;flex-direction:column;align-items:flex-end;gap:0;text-align:right}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:14px}
.lanes>*{min-width:0}
.lanebox{display:flex;flex-direction:column;gap:8px}
.lanebox h3{font-size:18px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.pc b{display:block;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.dv .card{padding:9px 11px}
.dv .card .desc{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.flags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.flags li{background:var(--flag-soft);border-radius:8px;padding:8px 12px;font-size:14px}
section.block{display:flex;flex-direction:column;gap:10px;margin-top:18px}
section.block>h3{font-size:18px}
.maps{display:inline-flex;gap:6px;font-size:12px}
.maps a{text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--muted)}
.maps a:hover{color:var(--sea);border-color:var(--sea)}

/* todo + log */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;max-width:760px}
.cat{font-family:var(--f-display);font-size:17px;margin-top:8px}
.todo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.todo input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--tang)}
.todo.done .tx{text-decoration:line-through;color:var(--muted)}
.own{font-size:12px;color:var(--sea);font-weight:700}
.chip{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:99px;padding:1px 10px;font-size:13px;white-space:nowrap}
.commit{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.commit .h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.commit .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,15,14,.45)}
.dlg{display:flex;flex-direction:column;gap:10px;padding:18px}
.dlg h3{font-size:20px}
.dlg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.dlg .acts .left{margin-right:auto}
.dlg .check{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
input,select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;font-size:15px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:60px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--tang);padding-left:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
footer{font-size:12px;color:var(--muted)}
@media (max-width:520px){.dlg .two{grid-template-columns:1fr}.stay{align-items:flex-start;text-align:left}.pc{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="tt"><h1 id="title">濟州島家族旅行</h1><div class="facts" id="facts"></div></div>
    <div class="topright">
      <div class="count"><span class="lbl muted small">距離出發</span><b id="cd">–</b><span class="muted unit">天</span></div>
      <div class="editwrap">
        <label class="editsw" id="editsw"><input type="checkbox" id="editmode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span id="edit-lbl">編輯行程</span></label>
        <div class="edittip" id="edittip" hidden>想改行程？點這裡</div>
      </div>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="bar" id="nav" aria-label="切換畫面">
    <div class="tabs">
      <button data-view="day"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8 14h3M8 17h6"/></svg><span>每日行程</span></button>
      <button data-view="board"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span>總覽看板</span></button>
      <button data-view="map"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.4"/></svg><span>地圖</span></button>
      <button data-view="cost"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 9l1.6 6.5L12 10l1.9 5.5L15.5 9M8 12h8"/></svg><span>費用</span></button>
      <button data-view="todo" class="wide-only"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg><span>待辦</span></button>
      <button data-view="log" class="wide-only"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>修改紀錄</span></button>
      <button data-view="more" class="narrow-only"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg><span>更多</span></button>
    </div>
    <div class="baracts wide-only">
      <button class="btn ghost" id="btn-img">行程長圖</button>
      <button class="btn ghost" id="btn-xlsx">匯出 Excel</button>
    </div>
  </nav>
  <main id="main"><p class="muted">載入中…</p></main>
  <footer id="footer"></footer>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* ================= state ================= */
const LS_DRAFT="jeju-draft-v1", LS_TOKEN="jeju-gh-token", LS_NAME="jeju-my-name";
const S={pub:null,pubHash:"",draft:null,draftBase:"",alt:null,view:"board",day:null,edit:false,showChanges:false,log:null};
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(k==="text")e.textContent=v;else e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
const naver=q=>"https://map.naver.com/p/search/"+encodeURIComponent(q);
const gmap=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const mapLinks=q=>q?h("span",{class:"maps"},h("a",{href:naver(q),target:"_blank",rel:"noopener"},"Naver"),h("a",{href:gmap(q),target:"_blank",rel:"noopener"},"Google")):null;

function shown(){return S.alt?S.alt.data:(S.draft||S.pub)}
function editable(){return S.edit&&!S.alt}
function ensureDraft(){if(!S.draft){S.draft=clone(S.pub);S.draftBase=S.pubHash}return S.draft}
function saveDraft(){
  if(S.draft&&JSON.stringify(S.draft)===JSON.stringify(S.pub)){S.draft=null}
  if(S.draft) ls.set(LS_DRAFT,JSON.stringify({base:S.draftBase,data:S.draft,at:Date.now()})); else ls.del(LS_DRAFT);
}
function commit(fn){ensureDraft();fn(S.draft);saveDraft();render()}

/* ================= list helpers ================= */
const keyOf=(d,l)=>d+"/"+l;
function dayOf(data,id){return data.days.find(x=>x.id===id)}
function laneAny(day,l){return day.lanes.find(x=>x.id===l)||(day.archived||[]).find(x=>x.id===l)}
function getList(data,key){const[d,l]=key.split("/");const day=dayOf(data,d);if(!day)return null;
  if(l==="_pocket")return day.backups;const lane=laneAny(day,l);return lane?lane.items:null}
function laneShort(lane){return (lane.label||"").split("｜")[0]}
function laneName(lane){const p=(lane.label||"").split("｜");return (p[1]||p[0]||"").trim()}
function isPending(day){return day.lanes.length>1&&day.lanes.some(l=>l.option)}
function listLabel(data,key){const[d,l]=key.split("/");const day=dayOf(data,d);if(!day)return key;
  if(l==="_pocket")return day.date+" 口袋名單";const lane=laneAny(day,l);if(!lane)return day.date;
  const arch=!day.lanes.includes(lane);
  return day.date+((day.lanes.length>1||lane.option||arch)?" "+laneShort(lane):"")+(arch?"（沒選）":"")}
function allKeys(data){const ks=[];for(const d of data.days){for(const l of d.lanes)ks.push(keyOf(d.id,l.id));for(const l of d.archived||[])ks.push(keyOf(d.id,l.id));ks.push(keyOf(d.id,"_pocket"))}return ks}
function locate(data){const m={};for(const k of allKeys(data)){(getList(data,k)||[]).forEach((it,i)=>m[it.id]={key:k,idx:i,it})}return m}

/* ================= diff ================= */
const F={time:"時間",name:"名稱",desc:"說明",price:"費用",map:"地圖搜尋字",by:"提議人"};
function diff(a,b){
  const out=[],mark={};if(!a||!b)return{out,mark};
  const la=locate(a),lb=locate(b);
  for(const id in lb){const B=lb[id];
    if(!la[id]){out.push({t:"add",x:`${listLabel(b,B.key)}：新增「${B.it.name}」`});mark[id]="add";continue}
    const A=la[id];
    if(A.key!==B.key){out.push({t:"move",x:`「${B.it.name}」從 ${listLabel(a,A.key)} 移到 ${listLabel(b,B.key)}`});mark[id]="move"}
    for(const f in F){if((A.it[f]||"")!==(B.it[f]||"")){
      out.push({t:"edit",x:f==="time"||f==="price"?`「${B.it.name}」${F[f]}：${A.it[f]||"（空）"} → ${B.it[f]||"（空）"}`:f==="name"?`「${A.it.name}」改名為「${B.it.name}」`:`「${B.it.name}」修改${F[f]}`});
      if(!mark[id])mark[id]="edit"}}
    if(A.it.lat!==B.it.lat||A.it.lng!==B.it.lng){out.push({t:"edit",x:`「${B.it.name}」${B.it.lat==null?"移除位置":"設定位置"}`});if(!mark[id])mark[id]="edit"}
    if(!!A.it.gap!==!!B.it.gap){out.push({t:"edit",x:`「${B.it.name}」${B.it.gap?"標為待補":"取消待補"}`});if(!mark[id])mark[id]="edit"}
  }
  for(const id in la)if(!lb[id])out.push({t:"del",x:`${listLabel(a,la[id].key)}：刪除「${la[id].it.name}」`});
  const ka=new Set(allKeys(a));
  for(const k of allKeys(b)){if(!ka.has(k))continue;
    const sa=(getList(a,k)||[]).map(x=>x.id),sb=(getList(b,k)||[]).map(x=>x.id);
    const common=sa.filter(id=>sb.includes(id)),cb=sb.filter(id=>sa.includes(id));
    if(common.join()!==cb.join()){out.push({t:"move",x:`${listLabel(b,k)}：調整順序`});
      cb.forEach((id,i)=>{if(common[i]!==id&&!mark[id])mark[id]="move"})}}
  for(const db of b.days){const da=dayOf(a,db.id);if(!da){out.push({t:"add",x:`新增一天 ${db.date}`});continue}
    if(da.title!==db.title||da.short!==db.short)out.push({t:"edit",x:`${db.date} 標題改為「${db.title}」`});
    if(JSON.stringify(da.stay)!==JSON.stringify(db.stay))out.push({t:"edit",x:`${db.date} 住宿改為「${db.stay.name||db.stay.area}」`});
    if((da.notes||[]).join("\n")!==(db.notes||[]).join("\n"))out.push({t:"edit",x:`${db.date} 修改討論點`});
    const decA=(da.decided&&da.decided.lane)||"",decB=(db.decided&&db.decided.lane)||"";
    if(decA!==decB){const ln=decB&&laneAny(db,decB);out.push({t:"edit",x:decB?`${db.date} 定案：${ln?ln.label:decB}`:`${db.date} 取消定案，回到多個方案`})}
    for(const lb2 of db.lanes){const la2=laneAny(da,lb2.id);
      if(!la2){out.push({t:"add",x:`${db.date} 新增「${lb2.label||"分組"}」`});continue}
      if(la2.label!==lb2.label)out.push({t:"edit",x:`${db.date}「${la2.label}」改名為「${lb2.label}」`});
      if((la2.pro||"")!==(lb2.pro||"")||(la2.con||"")!==(lb2.con||"")||(la2.notes||[]).join()!==(lb2.notes||[]).join())out.push({t:"edit",x:`${db.date} 修改「${laneShort(lb2)}」的說明`})}
    for(const la2 of [...da.lanes,...(da.archived||[])])if(!laneAny(db,la2.id))out.push({t:"del",x:`${da.date} 刪除「${la2.label||"分組"}」`});
  }
  const ta={};(a.todos||[]).forEach(t=>ta[t.id]=t);const tb={};(b.todos||[]).forEach(t=>tb[t.id]=t);
  for(const id in tb){const B=tb[id],A=ta[id];
    if(!A){out.push({t:"add",x:`待辦：新增「${B.text}」`});continue}
    if(!!A.done!==!!B.done)out.push({t:"edit",x:`待辦：「${B.text}」${B.done?"完成":"改回未完成"}`});
    if(A.text!==B.text||(A.owner||"")!==(B.owner||""))out.push({t:"edit",x:`待辦：修改「${B.text}」`})}
  for(const id in ta)if(!tb[id])out.push({t:"del",x:`待辦：刪除「${ta[id].text}」`});
  if(JSON.stringify(a.budget||{})!==JSON.stringify(b.budget||{}))out.push({t:"edit",x:"修改費用／分帳設定"});
  return{out,mark}
}
function currentDiff(){if(S.alt)return diff(S.pub,S.alt.data);if(S.draft)return diff(S.pub,S.draft);return{out:[],mark:{}}}

/* ================= render ================= */
function render(){
  const data=shown();const D=currentDiff();
  $("#title").textContent=data.trip.title;
  $("#facts").replaceChildren(...(data.trip.facts||[]).map(f=>h("span",{},f)));
  $("#footer").replaceChildren(data.trip.footer||"","　",h("button",{class:"chip",onclick:()=>{
    const inp=h("input",{type:"date",id:"f-start2"});inp.value=ls.get(LS_START)||"";
    openDlg(h("h3",{},"設定出發日"),h("p",{class:"note",style:"margin:0"},"只存在這台裝置，不會放到網站上。設了就會顯示倒數，旅行中打開會直接跳到當天。"),h("label",{},"出發日（Day 1）",inp),
      h("div",{class:"acts"},h("button",{class:"btn ghost",value:"cancel"},"取消"),h("button",{type:"button",class:"btn tang",onclick:()=>{if(inp.value)ls.set(LS_START,inp.value);else ls.del(LS_START);dlg.close();updateCountdown()}},"儲存")))}},"設定出發日（只存在這台裝置）"));
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===S.view||(b.dataset.view==="more"&&["todo","log"].includes(S.view)))));
  ls.set("jeju-view",JSON.stringify({view:S.view,day:S.day}));
  const sw=$("#editmode");sw.checked=S.edit;sw.disabled=!!S.alt;
  $("#editsw").className="editsw"+(S.alt?" off":editable()?" on":"");
  $("#edit-lbl").textContent=editable()?"完成":"編輯行程";
  $("#edittip").hidden=!!(S.alt||S.edit||ls.get("jeju-edit-seen"));
  document.body.classList.toggle("edit",editable());
  renderBanner(D);
  const main=$("#main");const keepX=main.querySelector(".board")?.scrollLeft||0;
  if(MAP.m){MAP.m.remove();MAP.m=null}
  main.replaceChildren();
  if(S.view==="board")main.append(renderBoard(data,D.mark));
  else if(S.view==="day"){main.append(renderDayView(data,D.mark));fillLegs(dayOf(data,S.day))}
  else if(S.view==="map"){main.append(renderMapView(data));drawMap(data)}
  else if(S.view==="cost")main.append(renderCost(data));
  else if(S.view==="todo")main.append(renderTodo(data));
  else if(S.view==="more")main.append(renderMore(data));
  else main.append(renderLog());
  const b=main.querySelector(".board");if(b)b.scrollLeft=keepX;
  setupSortable();
}
function renderBanner(D){
  const box=$("#banner");box.replaceChildren();
  if(editable())box.append(h("div",{class:"editbar"},h("span",{},h("b",{},"編輯中　"),"按住卡片左邊的點點拖曳，點卡片可以修改"),
    h("button",{class:"btn",onclick:()=>{S.edit=false;render()}},"完成")));
  box.style.cssText="display:flex;flex-direction:column;gap:8px";
  const list=()=>S.showChanges&&D.out.length?h("ol",{class:"changes"},D.out.map(c=>h("li",{class:c.t},c.x))):null;
  const toggle=()=>h("button",{class:"btn ghost",onclick:()=>{S.showChanges=!S.showChanges;render()}},S.showChanges?"收起變更":"看變更（"+D.out.length+"）");
  if(S.alt){
    const who=S.alt.kind==="proposal"?`${S.alt.by||"家人"} 的提案${S.alt.msg?"：「"+S.alt.msg+"」":""}`:`舊版本：${S.alt.label}`;
    box.append(h("div",{class:"banner alt"},h("div",{class:"row"},
      h("div",{class:"msg"},h("b",{},who),h("br"),D.out.length?`跟目前版本有 ${D.out.length} 處不同，有變動的項目會標顏色。`:"跟目前版本一樣。"),
      D.out.length?toggle():null,
      h("button",{class:"btn tang",onclick:adoptAlt},"從這個版本接著改"),
      h("button",{class:"btn ghost",onclick:()=>{S.alt=null;history.replaceState(null,"",location.pathname);render()}},"回到目前版本")),list()));
    return}
  if(S.draft){
    const stale=S.draftBase&&S.draftBase!==S.pubHash;
    box.append(h("div",{class:"banner draft"},h("div",{class:"row"},
      h("div",{class:"msg"},h("b",{},`你有 ${D.out.length} 處修改還沒發布`),h("br"),"只存在這台裝置。可以分享連結給家人看，或存到 GitHub 成為正式版本。",
        stale?h("div",{style:"color:var(--flag)"},"注意：正式版本在你修改之後有更新過，變更清單裡可能包含別人改的東西。"):null),
      toggle(),
      h("button",{class:"btn tang",onclick:openShare},"分享給家人看"),
      h("button",{class:"btn",onclick:openSave},"存到 GitHub"),
      h("button",{class:"btn ghost",id:"discard",onclick:e=>{const b=e.currentTarget;if(b.dataset.sure){S.draft=null;saveDraft();S.showChanges=false;render();toast("已放棄修改")}else{b.dataset.sure="1";b.textContent="再按一次確認放棄"}}},"放棄修改")),list()));
  }
}
function cardEl(it,mark,detailed){
  const m=mark[it.id];const tag=m?{add:"新增",move:"移動",edit:"修改"}[m]:"";
  return h("div",{class:"card"+(it.gap?" gap":"")+(m?" c-"+m:""),"data-id":it.id,onclick:e=>{if(e.target.closest(".grip")||e.target.closest("a"))return;openItem(it.id)}},
    h("span",{class:"grip","aria-label":"拖曳"}),
    h("div",{class:"body"},it.time?h("span",{class:"tm"},it.time):null,h("b",{},it.name),tag?h("span",{class:"chgtag"},tag):null,it.by?h("span",{class:"by"},it.by+" 提"):null,
      detailed&&it.desc?h("span",{class:"desc"},it.desc):null,
      it.price?h("div",{},h("span",{class:"tix"},it.price)):null,
      detailed&&it.map?h("div",{style:"margin-top:3px"},mapLinks(it.map),it.approx?h("span",{class:"approx"}," 位置是大概的"):null):null));
}
function listEl(data,key,mark,detailed){
  const items=getList(data,key)||[];
  return h("div",{class:"listwrap"},h("div",{class:"list","data-list":key},items.map(it=>cardEl(it,mark,detailed))),
    editable()?h("button",{class:"addbtn",onclick:()=>openItem(null,key)},"＋ 新增"):null);
}
function renderBoard(data,mark){
  const wrap=h("div",{class:"board"});
  for(const d of data.days){
    const col=h("div",{class:"col"},
      h("button",{class:"colhead",onclick:()=>{S.view="day";S.day=d.id;render();scrollTo({top:0})}},
        h("span",{class:"d"},d.date+"（"+d.dow+"）"),h("span",{class:"t"},d.short||d.title),
        h("span",{class:"s"},"住："+(d.stay.area||"—")),
        h("span",{style:"display:flex;gap:6px;flex-wrap:wrap;margin-top:2px"},
          isPending(d)?h("span",{class:"pill"},"待定案"):d.decided?h("span",{class:"pill ok"},"已定案"):null,
          (d.notes||[]).length?h("span",{class:"notecount"},d.notes.length+" 個討論點"):null)));
    for(const l of d.lanes){
      if(d.lanes.length>1||l.label)col.append(h("div",{class:"lanelabel"},h("span",{},l.label||"")));
      col.append(listEl(data,keyOf(d.id,l.id),mark,false));
    }
    col.append(h("div",{class:"pocket"},h("div",{class:"lanelabel"},h("span",{},"口袋名單"),h("span",{style:"font-weight:400"},editable()?"拖進上面就排進行程":"")),listEl(data,keyOf(d.id,"_pocket"),mark,false)));

async function makeLink(){

  const days={};for(const d of S.draft.days){const pd=dayOf(S.pub,d.id);if(!pd||JSON.stringify(pd)!==JSON.stringify(d))days[d.id]=d}
  const payload={v:2,by,msg:v("f-msg"),at:Date.now(),days};
  if(JSON.stringify(S.draft.todos)!==JSON.stringify(S.pub.todos))payload.todos=S.draft.todos;
  if(JSON.stringify(S.draft.trip)!==JSON.stringify(S.pub.trip))payload.trip=S.draft.trip;
  const url=location.origin+location.pathname+"#p="+LZString.compressToEncodedURIComponent(JSON.stringify(payload));

const WEEK={"一":"星期一","二":"星期二","三":"星期三","四":"星期四","五":"星期五","六":"星期六","日":"星期日"};
function gridSheet(data){
  const H0=5,H1=21,rows=[],merges=[];const cols=[];data.days.forEach(d=>d.lanes.forEach(l=>cols.push({d,l})));
  const hdr=[null],sub=[null];
  cols.forEach(({d,l})=>{hdr.push({v:d.date+" "+(WEEK[d.dow]||d.dow)+(d.lanes.length>1&&l.option?"｜"+laneShort(l):""),s:1});
    sub.push({v:d.lanes.length>1||l.label?(l.label||"").replace("｜","\n"):d.title,s:1})});
  rows.push(hdr,sub);
  for(let hr=H0;hr<=H1;hr++){const r=[{v:hr+"-"+(hr+1),s:3}];cols.forEach(()=>r.push({v:"",s:2}));rows.push(r)}
  const kw=t=>/晚上|晚餐|夜/.test(t)?19:/下午/.test(t)?14:/中午|午餐/.test(t)?12:/早上|上午|早餐/.test(t)?8:null;
  cols.forEach(({l},ci)=>{const c=ci+1;let prev=8;const slots={};
    l.items.forEach(it=>{const t=parseTime(it.time);let st=t?Math.floor(t.s/60):(kw(it.time+it.name)??prev);st=Math.min(H1,Math.max(H0,st));
      let en=t&&t.e!=null?Math.ceil(t.e/60)-1:st;en=Math.min(H1,Math.max(st,en));prev=st;
      const txt=[it.time,it.name,it.desc,it.price,it.by?"（"+it.by+" 提議）":""].filter(Boolean).join("\n");
      if(!slots[st])slots[st]={txt:[],en:st,gap:false};slots[st].txt.push(txt);slots[st].en=Math.max(slots[st].en,en);if(it.gap)slots[st].gap=true});
    const starts=Object.keys(slots).map(Number).sort((a,b)=>a-b);
    starts.forEach((st,i)=>{const sl=slots[st];const ri=2+st-H0;rows[ri][c]={v:sl.txt.join("\n\n"),s:sl.gap?4:2};
      const lim=i+1<starts.length?starts[i+1]-1:H1;const en=Math.min(sl.en,lim);if(en>st)merges.push(`${colName(c)}${ri+1}:${colName(c)}${2+en-H0+1}`)})});
  const stay=[{v:"住宿",s:3}];let ci=1;
  data.days.forEach(d=>{const txt=d.stay.name?(d.stay.area?d.stay.area+"\n":"")+d.stay.name+(d.stay.note?"\n"+d.stay.note:""):(d.stay.area||"");
    d.lanes.forEach((l,i)=>stay.push({v:i===0?txt:"",s:6}));if(d.lanes.length>1)merges.push(`${colName(ci)}${rows.length+1}:${colName(ci+d.lanes.length-1)}${rows.length+1}`);ci+=d.lanes.length});
  rows.push(stay);
  return{rows,merges,cols:[7,...cols.map(()=>30)],freeze:[1,2]};
}
function listSheet(head,body,widths){return{rows:[head.map(x=>({v:x,s:7})),...body.map(r=>r.map(x=>typeof x==="number"?{v:x,s:9}:{v:x==null?"":String(x),s:2}))],cols:widths,freeze:[0,1]}}
function exportXlsx(){
  const data=shown();const b=BUD(data);const c=costCalc(data);
  const detail=[];data.days.forEach(d=>{
    d.lanes.forEach(l=>l.items.forEach(it=>detail.push([d.date,d.dow,d.lanes.length>1||l.label?l.label:"",d.lanes.length>1&&l.option?"待定案":"行程",it.time,it.name,it.desc,it.price,it.by||"",it.map?naver(it.map):"",it.lat!=null?it.lat+", "+it.lng:""])));
    (d.archived||[]).forEach(l=>l.items.forEach(it=>detail.push([d.date,d.dow,l.label,"沒選的方案",it.time,it.name,it.desc,it.price,it.by||"",it.map?naver(it.map):"",it.lat!=null?it.lat+", "+it.lng:""])));
    d.backups.forEach(it=>detail.push([d.date,d.dow,"","口袋名單",it.time,it.name,it.desc,it.price,it.by||"",it.map?naver(it.map):"",it.lat!=null?it.lat+", "+it.lng:""]))});
  const notes=[];data.days.forEach(d=>{(d.notes||[]).forEach(n=>notes.push([d.date,"整天",n]));d.lanes.forEach(l=>(l.notes||[]).forEach(n=>notes.push([d.date,laneShort(l),n])))});
  const cost=[];c.days.forEach(x=>x.lanes.forEach(y=>cost.push(["門票活動",x.d.date+(x.lanes.length>1?" "+laneShort(y.l):""),Math.round(y.min),"KRW","每人",1,"",Math.round(y.min*b.rate)])));
  b.lines.forEach(l=>{const t=lineTWD(b,l);cost.push(["其他",l.name,+l.amount||0,l.cur,l.per==="人"?"每人":"全團",+l.days||1,l.payer||"",Math.round(l.per==="人"?t:t/b.people)])});
  cost.push([],["合計","每人大約",null,null,null,null,null,Math.round(c.perMin)],["合計",`全團 ${b.people} 人大約`,null,null,null,null,null,Math.round(c.grpMin)]);
  const st=settle(b);if(st){cost.push([],["分帳",`每人應付 ${NT(st.share)}`]);st.tr.forEach(t=>cost.push(["分帳",`${t.from} 給 ${t.to}`,null,null,null,null,null,Math.round(t.amt)]))}
  const sheets=[["濟州島總表",gridSheet(data)],
    ["明細",listSheet(["日期","星期","分組／方案","狀態","時間","項目","說明","費用","提議人","Naver 地圖","座標"],detail,[7,5,22,10,13,28,44,22,9,30,18])],
    ["待討論",listSheet(["日期","關於","內容"],notes,[8,10,80])],
    ["費用",listSheet(["類別","項目","金額","幣別","怎麼算","次數","誰先付","每人（NT$）"],cost,[10,34,12,7,8,7,10,13])],
    ["待辦",listSheet(["分類","事項","負責人","完成"],(data.todos||[]).map(t=>[t.cat,t.text,t.owner||"",t.done?"✓":""]),[12,50,12,6])]];
  const files=[
    {name:"[Content_Types].xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+"</Types>"},
    {name:"_rels/.rels",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>`<sheet name="${xesc(s[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+"</sheets></workbook>"},
    {name:"xl/_rels/workbook.xml.rels",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:"xl/styles.xml",text:STYLES},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,text:sheetXml(s[1])}))];
  const now=new Date();const ymd=now.getFullYear()+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0");
  const name=`濟州島行程_${S.alt?(S.alt.kind==="proposal"?"提案":"舊版"):S.draft?"草稿":"正式版"}_${ymd}.xlsx`;
  const blob=zipStore(files);saveBlob(blob,name);
  toast(isAnyPending(data)?"已匯出。還有日子沒定案，總表會把方案並排列出。":"已匯出 "+name);
  return blob;
}
function isAnyPending(data){return data.days.some(isPending)}
/* departure date: kept only on this device, so the public site never shows real dates */
const LS_START="jeju-start";
function localStart(){const s=ls.get(LS_START)||(S.pub&&S.pub.trip.start)||"";return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:""}
function daysToStart(){const s=localStart();if(!s)return null;const now=new Date();return Math.round((new Date(s+"T00:00:00")-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5)}
function updateCountdown(){const n=daysToStart();const c=document.querySelector(".count");if(n==null){c.hidden=true;return}c.hidden=false;
  const len=shown().days.length;$("#cd").textContent=n>0?n:(-n<len?"Day "+(1-n):"已回家");
  c.querySelector(".unit").hidden=!(n>0);c.querySelector(".lbl").textContent=n>0?"距離出發":-n<len?"旅行中":"";}
function saveBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.style.display="none";document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},4000)}

/* ================= one-page image ================= */
async function makeImage(){
  const data=shown();try{await document.fonts.ready}catch(e){}
  const W=1080,P=56,FB='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',FD='"LXGW WenKai TC","Noto Serif TC",serif',FM='"IBM Plex Mono",ui-monospace,monospace';
  const C={paper:"#f2f4f3",card:"#ffffff",ink:"#1c2321",muted:"#5b6663",line:"#d5dcd9",tang:"#d9661f",tsoft:"#fce6d4",sea:"#1d716f",ssoft:"#d7ecea",flag:"#9a3d22"};
  const cv=document.createElement("canvas");cv.width=W;cv.height=16000;const x=cv.getContext("2d");x.textBaseline="top";
  const wrap=(t,font,maxW)=>{x.font=font;const out=[];let line="";for(const ch of String(t)){if(ch==="\n"){out.push(line);line="";continue}if(x.measureText(line+ch).width>maxW&&line){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out};
  const text=(t,X,Y,font,col)=>{x.font=font;x.fillStyle=col;x.fillText(t,X,Y)};
  let y=P;
  text(data.trip.title,P,y,`700 72px ${FD}`,C.ink);y+=92;
  text((data.trip.facts||[]).join("・"),P,y,`500 30px ${FB}`,C.tang);y+=60;
  for(const d of data.days){
    const y0=y;y+=28;
    text(d.date+"（"+d.dow+"）",P+28,y,`500 28px ${FM}`,C.tang);
    if(isPending(d)){x.font=`500 28px ${FM}`;const w=x.measureText(d.date+"（"+d.dow+"）").width;x.fillStyle=C.tsoft;x.fillRect(P+28+w+14,y-2,110,36);text("待定案",P+28+w+28,y+2,`700 24px ${FB}`,C.tang)}
    y+=42;
    for(const ln of wrap(d.title,`700 40px ${FD}`,W-2*P-56)){text(ln,P+28,y,`700 40px ${FD}`,C.ink);y+=52}
    if(d.stay.name||d.stay.area){for(const ln of wrap("住："+[d.stay.area,d.stay.name].filter(Boolean).join("・"),`400 26px ${FB}`,W-2*P-56)){text(ln,P+28,y,`400 26px ${FB}`,C.sea);y+=36}}
    y+=10;
    for(const l of d.lanes){
      if(d.lanes.length>1||l.label){y+=8;for(const ln of wrap(l.label,`700 28px ${FB}`,W-2*P-56)){text(ln,P+28,y,`700 28px ${FB}`,C.sea);y+=38}}
      for(const it of l.items){
        const tl=wrap(it.time||"",`500 24px ${FM}`,170);const nl=wrap(it.name,`${it.gap?400:700} 30px ${FB}`,W-2*P-56-200);
        x.strokeStyle=C.line;x.lineWidth=1;x.beginPath();x.moveTo(P+28,y);x.lineTo(W-P-28,y);x.stroke();y+=12;
        tl.forEach((t,i)=>text(t,P+28,y+4+i*30,`500 24px ${FM}`,C.muted));
        nl.forEach((t,i)=>text(t,P+28+200,y+i*40,`${it.gap?400:700} 30px ${FB}`,it.gap?C.flag:C.ink));
        y+=Math.max(tl.length*30,nl.length*40)+12;
      }
    }
    if((d.notes||[]).length&&isPending(d)){y+=6;text(`還有 ${d.notes.length} 個待討論`,P+28,y,`400 24px ${FB}`,C.flag);y+=34}
    y+=22;
    x.save();x.globalCompositeOperation="destination-over";x.fillStyle=C.card;x.strokeStyle=C.line;x.lineWidth=2;
    x.beginPath();x.roundRect?x.roundRect(P,y0,W-2*P,y-y0,22):x.rect(P,y0,W-2*P,y-y0);x.fill();x.stroke();x.restore();
    x.fillStyle=C.tang;x.fillRect(P,y0+24,8,52);
    y+=28;
  }
  text("行程有變動以網站為準："+location.host+location.pathname,P,y,`400 22px ${FB}`,C.muted);y+=P;
  const out=document.createElement("canvas");out.width=W;out.height=y;const o=out.getContext("2d");o.fillStyle=C.paper;o.fillRect(0,0,W,y);o.drawImage(cv,0,0);
  const blob=await new Promise(r=>out.toBlob(r,"image/png"));const url=URL.createObjectURL(blob);
  openDlg(h("h3",{},"行程長圖"),h("p",{class:"note",style:"margin:0"},"手機可以長按圖片儲存，或按下面的按鈕下載，再傳到 LINE 群組。"),
    h("div",{style:"max-height:55vh;overflow:auto"},h("img",{src:url,class:"imgprev",alt:"行程長圖"})),
    h("div",{class:"acts"},h("button",{class:"btn ghost",value:"cancel"},"關閉"),h("a",{class:"btn tang",href:url,download:"濟州島行程.png",style:"text-decoration:none"},"下載圖片")));
  return{w:W,h:y};
}

/* swipe left/right on the day view to change day (phone) */
(()=>{let sx=0,sy=0,ok=false;const main=$("#main");
  main.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;
    ok=S.view==="day"&&!editable()&&e.touches.length===1&&!e.target.closest(".daychips,.leaflet-container,.tblwrap,input,textarea,select")},{passive:true});
  main.addEventListener("touchend",e=>{if(!ok)return;ok=false;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*0.6)return;const days=shown().days;const i=days.findIndex(d=>d.id===S.day);
    const j=dx<0?i+1:i-1;if(j<0||j>=days.length)return;S.day=days[j].id;render();scrollTo({top:0})},{passive:true});
})();
window.addEventListener("hashchange",()=>{const p=readProposal();if(p){S.alt=p;render()}});
(async function(){
  try{const r=await fetch("trip.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;S.pub=await r.json()}
  catch(e){$("#main").replaceChildren(h("p",{},"讀不到 trip.json。請用 GitHub Pages 網址打開，或在資料夾裡開本機伺服器。"));return}
  S.pubHash=hash(JSON.stringify(S.pub));
  try{const d=JSON.parse(ls.get(LS_DRAFT)||"null");if(d&&d.data&&d.data.days){S.draft=d.data;S.draftBase=d.base||""}}catch(e){}
  if(S.draft&&JSON.stringify(S.draft)===JSON.stringify(S.pub)){S.draft=null;saveDraft()}
  S.alt=readProposal();
  // first view: remembered one, else phone → day view (today's date during the trip), desktop → board
  try{const sv=JSON.parse(ls.get("jeju-view")||"null");if(sv&&sv.view){S.view=sv.view;S.day=sv.day}}catch(e){}
  if(!ls.get("jeju-view")&&matchMedia("(max-width:720px)").matches)S.view="day";
  {const n=daysToStart();if(n!=null&&n<=0&&-n<shown().days.length){S.day=shown().days[-n].id;if(S.view!=="map")S.view="day"}}
  if(!matchMedia("(max-width:720px)").matches&&S.view==="more")S.view="board";
  updateCountdown();
  render();
})();
</script>
